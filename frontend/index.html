<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Runs before first paint: saved choice first, otherwise the device setting.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('sheuli-theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
        }
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230B1026'/%3E%3Cg fill='%23F8FAFC'%3E%3Cellipse cx='32' cy='16' rx='6' ry='11'/%3E%3Cellipse cx='32' cy='16' rx='6' ry='11' transform='rotate(60 32 32)'/%3E%3Cellipse cx='32' cy='16' rx='6' ry='11' transform='rotate(120 32 32)'/%3E%3Cellipse cx='32' cy='16' rx='6' ry='11' transform='rotate(180 32 32)'/%3E%3Cellipse cx='32' cy='16' rx='6' ry='11' transform='rotate(240 32 32)'/%3E%3Cellipse cx='32' cy='16' rx='6' ry='11' transform='rotate(300 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='6' fill='%23F97316'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Sheuli — WhatsApp AI Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
